name: Test ES-X Next RetroPie installer

on:
  push:
    branches:
      - experiment/batocera-es-standalone-module-20261013
    paths:
      - 'scriptmodules/supplementary/batocera-es-test.sh'
      - 'tests/test-batocera-es-test-entrypoint.sh'
      - 'tests/test-batocera-es-test-package.sh'
      - 'tests/test-batocera-es-test-install-direct.sh'
      - 'tests/test-batocera-es-test-classic-compat.sh'
      - 'tests/test-batocera-es-test-gamelist.py'
      - 'tests/test-batocera-es-test-bootstrap-retropiemenu.py'
      - 'scriptmodules/supplementary/batocera-es-test/**'
      - '.github/workflows/test-esx-next-installer.yml'
  workflow_dispatch:

jobs:
  test-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scriptmodules/supplementary/batocera-es-test.sh
      - name: Reversible launcher takeover and rollback
        run: bash tests/test-batocera-es-test-entrypoint.sh
      - name: Working CLI source-installer with actual PTY
        run: bash tests/test-batocera-es-test-install-direct.sh
      - name: Classic EmulationStation coexistence and system catalog migration
        run: bash tests/test-batocera-es-test-classic-compat.sh
      - name: Installed resources and private default theme
        run: bash tests/test-batocera-es-test-package.sh
      - name: RetroPie Setup menu metadata isolation and safe merges
        run: python3 tests/test-batocera-es-test-gamelist.py -v
      - name: Fresh Tarave RetroPie menu bootstrap without touching original settings
        run: python3 tests/test-batocera-es-test-bootstrap-retropiemenu.py -v
      - name: Guard isolated DRM/KMS console test
        run: |
          grep -q -- '--tty-test' scriptmodules/supplementary/batocera-es-test.sh
          grep -q 'SDL_VIDEODRIVER=kmsdrm' scriptmodules/supplementary/batocera-es-test.sh
